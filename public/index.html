  <body>
    <main>
      <h1 class="visually-hidden">our.are.why: live fast, eat trash</h1>
      <!--
        Silent and looping like a GIF, at a fraction of a GIF's size. The
        browser plays the first source it can decode: AV1 where supported,
        otherwise H.264. Visitors who ask their system for reduced motion get
        a still frame instead; browsers too old to read the media attribute
        play the loop. Until the video arrives, the poster shows a small
        copy of its first frame. The #t=0.001 makes iOS Safari show the
        full first frame when it won't autoplay (Low Power Mode). role="img"
        on the wrapper makes screen readers announce the label the way they
        announce an image's alt text. The videos and poster are made by
        scripts/encodeVideo.sh.
      -->
      <div class="art" role="img"
        aria-label="A pixel-art sloth sits beside a tipped-over trash can, holding a sign that reads “got ******? anything helps”">
        <video autoplay muted loop playsinline disablepictureinpicture disableremoteplayback
          poster="assets/ourarewhy.poster.webp">
          <source src="assets/ourarewhy.av1.mp4#t=0.001" type='video/mp4; codecs="av01.0.08M.08"'
            media="(prefers-reduced-motion: no-preference)">
          <source src="assets/ourarewhy.h264.mp4#t=0.001" type='video/mp4; codecs="avc1.640028"'
            media="(prefers-reduced-motion: no-preference)">
          <source src="assets/ourarewhy.still.h264.mp4#t=0.001" type='video/mp4; codecs="avc1.640028"'>
        </video>
      </div>
